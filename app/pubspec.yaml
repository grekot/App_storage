name: sklep
description: "Sklep rodzinny - instalacja i aktualizacje aplikacji grekot"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  http: ^1.6.0
  crypto: ^3.0.7
  path_provider: ^2.1.6
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.5
  # Logowanie, książka adresowa e-maili - wspólne z Zakupami i Powrotem.
  # Lokalnie nadpisane ścieżką w pubspec_overrides.yaml (poza gitem).
  wspolne:
    git:
      url: https://github.com/grekot/T_rex_3.git
      path: wspolne
  firebase_messaging: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
