name: CI

# Każdy push / PR: analiza i testy aplikacji sklepu, testy reguł Firestore na emulatorze
# i testy skryptu publikacji wersji. Push na main (albo ręczne uruchomienie): po zielonych
# testach reguł publikuje firebase/firestore.rules w projekcie Firebase.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_removed:
        description: 'Zgoda na usunięcie kolekcji, których nie ma już w pliku reguł'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Zaślepka konfiguracji Firebase (prawdziwa jest poza gitem)
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          import 'package:firebase_core/firebase_core.dart';
          const bool firebaseConfigured = false;
          const FirebaseOptions firebaseOptions = FirebaseOptions(apiKey: '', appId: '', messagingSenderId: '', projectId: '');
          EOF
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/test/package-lock.json
      - run: npm ci
      - run: npm test

  ci-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ci-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Testy polecenia sklep (CLI)
        working-directory: tools/sklep-cli
        run: node --test lib.test.mjs

  # Reguły Firestore: jeden zestaw dla całego projektu zakupy-8ec54 (Zakupy, Powrót, Na szczycie,
  # Waga, sklep). Publikuje tylko main i tylko po przejściu testów na emulatorze; bez zmian = nic.
  deploy-rules:
    needs: [rules, ci-publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-rules
      cancel-in-progress: false
    defaults:
      run:
        working-directory: tools/ci-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node deploy-rules.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALLOW_REMOVED: ${{ inputs.allow_removed && 'true' || 'false' }}
